
# Shared lighting support; hardware-specific transport belongs in boards/.
CONFIG_LED_STRIP=y
CONFIG_LOG=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_SETTINGS=y
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y
CONFIG_LOG_RATELIMIT=y

# One portable mesh element, independent of strip length.
CONFIG_MESHLIGHT_MESH=y
CONFIG_BT=y
CONFIG_BT_MESH=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_DEVICE_NAME="Meshlight"
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MESH_PB_GATT=y
CONFIG_BT_MESH_PB_ADV=y
CONFIG_BT_MESH_RELAY=y
CONFIG_BT_MESH_RELAY_ENABLED=y
CONFIG_BT_MESH_GATT_PROXY=y
CONFIG_BT_MESH_GATT_PROXY_ENABLED=y
CONFIG_BT_MESH_BEACON_ENABLED=y
CONFIG_BT_MESH_DEFAULT_TTL=7
CONFIG_BT_MESH_LOW_POWER=n
CONFIG_BT_MESH_FRIEND=n
CONFIG_BT_MESH_CRPL=32
CONFIG_BT_MESH_SUBNET_COUNT=2
CONFIG_BT_MESH_APP_KEY_COUNT=2
# Allow both subnet key generations and temporary crypto keys during refresh.
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=32
CONFIG_BT_MESH_MODEL_KEY_COUNT=2
CONFIG_BT_MESH_MODEL_GROUP_COUNT=4
CONFIG_BT_MESH_ADV_BUF_COUNT=20
CONFIG_BT_MESH_TX_SEG_MAX=6
CONFIG_BT_RX_STACK_SIZE=5120
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_PSA_WANT_ALG_SHA_256=y
