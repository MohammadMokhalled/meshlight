# SPI21 drives the strip without blocking interrupts for GPIO bit-banging.
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
# Persistent format: erase Settings once when migrating from onoff-app's
# CRC-disabled records. Keep this option unchanged on subsequent updates.
CONFIG_ZMS_DATA_CRC=y
CONFIG_ZMS_NO_DOUBLE_WRITE=y

# PSA keeps mesh key material on this heap. Include persistent-key operations,
# provisioning and both configured subnets/AppKeys, rather than the SDK's 1 KiB.
CONFIG_MBEDTLS_HEAP_SIZE=8192
