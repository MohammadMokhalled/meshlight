# SPDX-License-Identifier: MIT
# I2S DMA avoids gaps between the nRF52832's short SPIM transactions.
CONFIG_I2S=y
CONFIG_WS2812_STRIP_I2S=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=8
# Reserve space for PSA key operations within the nRF52832 RAM budget.
CONFIG_MBEDTLS_HEAP_SIZE=4096

# The nRF52832 has 64 KiB RAM, shared by the application and radio controller.
# Keep separate Mesh and GATT advertising sets, without reserving unused sets.
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_MESH_RELAY_ADV_SETS=0
CONFIG_BT_CTLR_SDC_SCAN_BUFFER_COUNT=2
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_CTLR_CHAN_SEL_2=n
CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_BUF_EVT_RX_COUNT=4
CONFIG_BT_BUF_ACL_TX_COUNT=2
# PB-GATT queues the 65-byte Public Key in up to four notifications at ATT MTU 23.
# Keep this independent of the reduced ACL count, which otherwise defaults ATT to two.
CONFIG_BT_ATT_TX_COUNT=4
CONFIG_BT_BUF_EVT_RX_SIZE=80
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=4
CONFIG_BT_BUF_CMD_TX_SIZE=65
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=3072
CONFIG_LIGHTING_PERSISTENCE_STACK_SIZE=2048
CONFIG_BT_MESH_ADV_BUF_COUNT=10
CONFIG_BT_MESH_RELAY_BUF_COUNT=4
CONFIG_LOG_BUFFER_SIZE=512
