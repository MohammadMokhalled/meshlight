# Keep the WS2812 bitstream continuous while the CPU runs other threads.
CONFIG_SPI=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI_STM32_DMA=y

# The strip has no chip-select input; only MOSI and the unused SCK are routed.
CONFIG_SPI_STM32_USE_HW_SS=n
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=8

# ST extended HCI firmware has a two-set legacy-PDU limit. Share one set.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_MESH_ADV_EXT=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
CONFIG_BT_MESH_RELAY_ADV_SETS=0
CONFIG_BT_MESH_ADV_EXT_GATT_SEPARATE=n

# Allow brief radio contention without dropping the Proxy link after 420 ms.
# GAP's automatic parameter update and PPCP use units of 10 ms.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_SECURE_STORAGE=y
CONFIG_TRUSTED_STORAGE=n
CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_SETTINGS=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_LOG_BUFFER_SIZE=8192
