name: Firmware CI

on:
  push:
    branches: [master, 'release/**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/firmware.yml
    with:
      source-sha: ${{ github.sha }}
      source-ref: ${{ github.ref }}

  publish:
    name: Publish final release
    needs: validate
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.validate.outputs.channel == 'final' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: meshlight-*-${{ needs.validate.outputs.version }}
          path: build/release
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: build-metadata
          path: build
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --metadata build/ci-metadata.json --packages build/release
